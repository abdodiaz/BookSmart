<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription - BookSmart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-96">
    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Créer un compte</h2>

    <form id="registerForm" class="space-y-4">
      <div>
        <label for="username" class="block text-gray-700 font-semibold mb-1">Nom complet</label>
        <input type="text" id="username" name="username" placeholder="Votre nom"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div>
        <label for="email" class="block text-gray-700 font-semibold mb-1">Email</label>
        <input type="email" id="email" name="email" placeholder="exemple@email.com"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div>
        <label for="password" class="block text-gray-700 font-semibold mb-1">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="********"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div>
        <label for="confirmPassword" class="block text-gray-700 font-semibold mb-1">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="********"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <button type="submit"
              class="w-full py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">
        S'inscrire
      </button>
    </form>

    <p class="text-center text-gray-600 mt-4">
      Déjà un compte ? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Se connecter</a>
    </p>

    <p id="message" class="text-center mt-2 text-red-500"></p>
  </div>

  <script src="../static/js/static/inscription.js"></script>
</body>
</html>
