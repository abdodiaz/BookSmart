<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — BookSmart</title>

  <!-- Tailwind CDN pour un design clean immédiat -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icônes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Ton CSS en plus, si tu veux (optionnel) -->
  <link rel="stylesheet" href="../static/css/style.css" />
  <style>
    :root { --brand:#6d28d9; }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .glass {
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.85);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-violet-50 to-white">
  <div class="relative min-h-screen flex items-center justify-center p-6">
    <!-- Décor -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <div class="absolute -top-20 -left-20 w-72 h-72 rounded-full bg-violet-200 blur-3xl opacity-50"></div>
      <div class="absolute -bottom-24 -right-24 w-80 h-80 rounded-full bg-fuchsia-200 blur-3xl opacity-40"></div>
    </div>

    <main class="w-full max-w-md">
      <div class="glass shadow-xl rounded-2xl p-8 border border-slate-100">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-10 h-10 rounded-xl bg-violet-600 flex items-center justify-center text-white font-semibold">B</div>
          <h1 class="text-2xl font-semibold text-slate-800">Se connecter à <span class="text-violet-700">BookSmart</span></h1>
        </div>

        <p class="text-slate-600 text-sm mb-6">
          Accédez à vos emprunts, réservations et recommandations personnalisées.
        </p>

        <!-- Zone d'alerte -->
        <div id="alert" class="hidden mb-4 rounded-lg border px-4 py-3 text-sm"></div>

        <form id="loginForm" class="space-y-4" novalidate>
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Adresse e-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="username"
              class="w-full rounded-xl border-slate-200 focus:border-violet-500 focus:ring-violet-500 px-4 py-2.5 outline-none"
              placeholder="vous@exemple.com"
            />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                required
                minlength="6"
                autocomplete="current-password"
                class="w-full rounded-xl border-slate-200 focus:border-violet-500 focus:ring-violet-500 px-4 py-2.5 pr-12 outline-none"
                placeholder="••••••••"
              />
              <button type="button" id="togglePwd" class="absolute inset-y-0 right-2 px-3 text-slate-500 hover:text-slate-700"
                      aria-label="Afficher le mot de passe">👁️</button>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <label class="inline-flex items-center gap-2 select-none text-sm text-slate-600">
              <input id="remember" type="checkbox" class="rounded border-slate-300 text-violet-600 focus:ring-violet-500">
              Se souvenir de moi
            </label>
            <a class="text-sm text-violet-700 hover:underline" href="#">Mot de passe oublié ?</a>
          </div>

          <button
            id="submitBtn"
            type="submit"
            class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-violet-600 text-white px-4 py-2.5 font-medium hover:bg-violet-700 focus:ring-4 focus:ring-violet-200 disabled:opacity-60 disabled:cursor-not-allowed transition"
          >
            <span>Se connecter</span>
            <svg id="spinner" class="hidden animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8v4A4 4 0 004 12z"></path>
            </svg>
          </button>
        </form>

        <p class="mt-6 text-sm text-slate-600">
          Pas de compte ? <a class="text-violet-700 hover:underline" href="./inscription.html">Créer un compte</a>
        </p>
      </div>

      <p class="mt-6 text-center text-xs text-slate-500">
        © <span id="year"></span> BookSmart. Tous droits réservés.
      </p>
    </main>
  </div>

  <script src="../static/js/login.js" defer></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
