<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil - BookSmart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Barre de navigation / recherche -->
  <header class="bg-white shadow p-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-blue-600">BookSmart</h1>
    <input type="text" id="searchInput" placeholder="Rechercher un livre..."
           class="border rounded-lg px-4 py-2 w-1/3 focus:outline-none focus:ring-2 focus:ring-blue-400">
  </header>

  <!-- Conteneur principal -->
  <main class="p-6">
    <div id="booksContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Les livres seront injectés ici par JS -->
    </div>
  </main>

  <script src="../static/js/static/home.js"></script>
</body>
</html>
