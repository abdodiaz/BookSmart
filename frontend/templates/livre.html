<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails du Livre - BookSmart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-white shadow p-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-blue-600">BookSmart</h1>
    <a href="home.html" class="text-blue-600 font-semibold hover:underline">Retour à l'accueil</a>
  </header>

  <main class="p-6 max-w-4xl mx-auto bg-white rounded-lg shadow mt-6">
    <div class="flex flex-col md:flex-row gap-6">
      <!-- Image du livre -->
      <img id="bookImage" src="" alt="Livre" class="w-full md:w-1/3 h-64 object-cover rounded-lg">

      <!-- Détails -->
      <div class="flex-1 flex flex-col justify-between">
        <div>
          <h2 id="bookTitle" class="text-2xl font-bold text-gray-800 mb-2"></h2>
          <p id="bookPrice" class="text-lg text-gray-700 mb-2"></p>
          <p id="bookDescription" class="text-gray-600 mb-4"></p>
          <span id="bookStatus" class="px-2 py-1 text-sm font-semibold rounded-full"></span>
        </div>

        <button id="reserveButton"
                class="mt-4 py-2 px-4 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50"
        >
          Réserver
        </button>

        <p id="message" class="text-red-500 mt-2"></p>
      </div>
    </div>
  </main>

  <script src="livre.js"></script>
</body>
</html>
